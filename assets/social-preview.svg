<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="sp-title sp-desc">
  <title id="sp-title">ceo-of-agents, a plugin for Claude Code</title>
  <desc id="sp-desc">You're the CEO. Your agents are the company. A chief of staff and departments that work from one git repo, behind approval gates. Start with /ceo-of-agents:init-fleet. On the right, the ceo-of-agents logo: a violet node for you, the CEO, above a teal node for the chief of staff, whose three branches land as commits on the teal git line of the hq. github.com/iamgiolaga/ceo-of-agents, open source, MIT.</desc>

  <!-- Full-bleed, no transparency: GitHub social previews are shown as PNG on light and dark surfaces. Keep content 64px+ from every edge (crop safety). -->
  <!-- Source for social-preview.png. The PNG is rendered with JetBrains Mono and Inter loaded (both SIL OFL 1.1); the system names after them are only a fallback for viewing this file. -->
  <rect x="0" y="0" width="1280" height="640" fill="#0F172A"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2DD4BF"/>

  <!-- Left: what it is -->
  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <rect x="80" y="96" width="230" height="36" rx="18" fill="none" stroke="#2DD4BF" stroke-width="2"/>
    <text x="195" y="120" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="2" fill="#2DD4BF">CLAUDE CODE PLUGIN</text>
    <text x="80" y="224" font-size="68" font-weight="700" fill="#F8FAFC">ceo-of-agents</text>
  </g>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="292" font-size="36" font-weight="600" fill="#F8FAFC">You're the CEO.</text>
    <text x="80" y="340" font-size="36" font-weight="600" fill="#2DD4BF">Your agents are the company.</text>
    <text x="80" y="400" font-size="22" fill="#94A3B8">A chief of staff and departments that work</text>
    <text x="80" y="432" font-size="22" fill="#94A3B8">from one git repo, behind approval gates.</text>
  </g>

  <rect x="80" y="476" width="440" height="56" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="104" y="512" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" fill="#F8FAFC"><tspan fill="#2DD4BF">&gt;</tspan> /ceo-of-agents:init-fleet</text>

  <!-- Right: the logo, 320 px tall, centred on (960, 304). Clear space: 68 px (the top node's diameter) free on every side. -->
  <g id="logo" transform="translate(800 144) scale(0.547945) translate(-220 -223)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#64748B" stroke-width="24">
      <path d="M512 362 L512 434"/>
      <path d="M512 558 C512 636 312 612 312 688"/>
      <path d="M512 558 L512 688"/>
      <path d="M512 558 C512 636 712 612 712 688"/>
    </g>
    <g stroke="#2DD4BF" stroke-width="24">
      <path d="M232 736 L266 736"/>
      <path d="M358 736 L466 736"/>
      <path d="M558 736 L666 736"/>
      <path d="M758 736 L792 736"/>
      <circle cx="312" cy="736" r="44"/>
      <circle cx="512" cy="736" r="44"/>
      <circle cx="712" cy="736" r="44"/>
    </g>
    <circle cx="512" cy="496" r="62" fill="#2DD4BF"/>
    <circle cx="512" cy="300" r="62" fill="#A78BFA"/>
  </g>

  <!-- Footer -->
  <text x="80" y="576" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#94A3B8">github.com/iamgiolaga/ceo-of-agents</text>
  <text x="1200" y="576" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#94A3B8">open source · MIT</text>
</svg>
